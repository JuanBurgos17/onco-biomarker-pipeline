name: CI Pipeline - OncoBiomarker

# Define cuándo se ejecutará este flujo de trabajo
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio en el servidor de pruebas de GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Configurar el entorno de Python 3.10
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 3. Instalar las dependencias del proyecto
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Ejecutar las pruebas automatizadas usando pytest
    - name: Run pytest
      run: |
        python -m pytest